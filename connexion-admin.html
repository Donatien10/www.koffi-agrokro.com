
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administrateur - Koffi-Agrokro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f1;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #00000015;
    }
    h1 { color: #174b3a; text-align: center; }
    p { text-align: center; color: #666; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: #174b3a;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #loginMessage { margin-top: 15px; color: #b42318; }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>Administration</h1>
    <p>Koffi-Agrokro – Espace réservé</p>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" required placeholder="Votre e-mail">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required placeholder="Votre mot de passe">

      <button type="submit" id="loginButton">Se connecter</button>
      <p id="loginMessage" role="status"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./connexion-admin.js"></script>
</body>
</html>
