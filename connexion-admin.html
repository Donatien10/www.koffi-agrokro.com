<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion administrateur | Koffi-Agrokro</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .login-container {
      max-width: 430px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #00000015;
    }

    .login-container h1 {
      color: #174b3a;
      text-align: center;
    }

    .login-container label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    .login-container input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      box-sizing: border-box;
    }

    .login-container button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #174b3a;
      color: white;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <h1>Koffi-Agrokro</h1>
    <h2>Connexion administrateur</h2>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required>

      <button type="submit" id="loginButton">
        Se connecter
      </button>

      <p id="loginMessage" role="status"></p>
    </form>

    <p><a href="./index.html">← Retour au site</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./connexion-admin.js"></script>
</body>
</html>
